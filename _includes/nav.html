<script>
  try { if (localStorage.getItem('divyanka:home-theme') === 'light') document.body.classList.add('light'); } catch (e) {}
</script>
<nav class="top" aria-label="Main">
  <a href="{{ '/' | relative_url }}"{% if page.layout == 'home' %} aria-current="page"{% endif %}>home</a>
  <a href="{{ '/blog/' | relative_url }}"{% if page.url contains '/blog/' or page.layout == 'post' %} aria-current="page"{% endif %}>writing</a>
  <a href="{{ '/about/' | relative_url }}"{% if page.url == '/about/' or page.url == '/contact/' %} aria-current="page"{% endif %}>about</a>
