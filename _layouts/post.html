---
layout: default
---

<article class="post">
  <p class="post-meta"><time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y-%m-%d" }}</time> &middot; {{ content | number_of_words | divided_by: 200 | plus: 1 }} min read</p>
  <h1 class="post-title">{{ page.title }}</h1>
  {{ content }}
</article>

<nav class="post-back">
  <a href="{{ '/writing/' | relative_url }}">&larr; cd ../writing</a>
</nav>
