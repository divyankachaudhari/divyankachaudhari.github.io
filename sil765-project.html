<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting...</title>
<script>
  // Redirect to the new domain after a brief delay
  setTimeout(function() {
    window.location.href = 'https://facebook.com/'; // Replace 'https://example.com/new-page' with your desired destination URL
  }, 1); // Adjust the delay time (in milliseconds) as needed
</script>
</head>
<body>
  <p>This page has moved. If you are not redirected automatically, <a href="https://facebook.com/">click here</a>.</p>
</body>
</html>
